name: Sync Store Downloads & Metadata

on:
  schedule:
    # Runs daily at 06:00 UTC to check Google Play & App Store for new download milestones
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-store-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch live store stats and update config
        run: node scripts/update-store-data.mjs

      - name: Commit and push if milestones updated
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config.js store-cache.json
          if git diff --cached --quiet; then
            echo "No store milestone changes to commit."
          else
            git commit -m "chore(data): auto-update store download milestones and metadata"
            git push
          fi
